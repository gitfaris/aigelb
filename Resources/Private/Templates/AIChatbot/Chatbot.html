<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="aigelb-chatbot-container">


    <!-- Error Messages -->
    <f:if condition="{hasError}">
        <div class="alert alert-danger" role="alert">
            <strong>Error:</strong> {errorMessage}
        </div>
    </f:if>

    <!-- Header with FlexForm settings -->
    <div class="aigelb-chatbot-header">
        <f:if condition="{settings.header}">
            <h2 class="aigelb-chatbot-title">{settings.header}</h2>
        </f:if>

        <f:if condition="{settings.subheader}">
            <h3 class="aigelb-chatbot-subtitle">{settings.subheader}</h3>
        </f:if>

        <f:if condition="{settings.bodytext}">
            <div class="aigelb-chatbot-description">
                <f:format.html>{settings.bodytext}</f:format.html>
            </div>
        </f:if>
    </div>



    <!-- Conversation History -->
    <f:if condition="{conversationMessages}">
        <h3 class="aigelb-history-title">Conversation:</h3>
        <div class="container">
            <f:for each="{conversationMessages}" as="message">
                <div class="row mb-3">
                    <div class="col-12">
                        <div class="aigelb-message-header">
                            <f:if condition="{message.role} == 'user'">
                                <strong>You:</strong>
                            </f:if>
                            <f:if condition="{message.role} == 'assistant'">
                                <strong>AI Assistant:</strong>
                            </f:if>
                            <span class="aigelb-message-time">
                                <f:format.date format="d.m.Y H:i">{message.date_created}</f:format.date>
                            </span>
                        </div>
                        <div class="aigelb-message-content">
                            <f:format.nl2br>{message.content}</f:format.nl2br>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>

    <!-- Current AI Response -->
    <f:if condition="{hasResponse}">
        <div class="container">
            <div class="row mb-3">
                <div class="col-12">
                    <div class="aigelb-current-response">
                        <div class="aigelb-message-header">
                            <strong>You:</strong>
                        </div>
                        <div class="aigelb-message-content aigelb-user-message">
                            <f:format.nl2br>{userInput}</f:format.nl2br>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12">
                    <div class="aigelb-current-response">
                        <div class="aigelb-message-header">
                            <strong>AI Assistant:</strong>
                        </div>
                        <div class="aigelb-message-content aigelb-ai-message">
                            <f:format.nl2br>{aiResponse}</f:format.nl2br>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </f:if>

    <!-- Main Chat Form -->
    <div class="container">
        <f:form action="chatbot" controller="AIChatbot" method="post" class="aigelb-form">
            <!-- Hidden conversation ID for session tracking -->
            <f:if condition="{conversationId}">
                <f:form.hidden name="conversationId" value="{conversationId}" />
            </f:if>

            <div class="row mb-3">
                <div class="col-10">
                    <f:form.textfield
                        name="userinput"
                        value=""
                        placeholder="{f:if(condition: settings.header, then: 'Ask {settings.header}...', else: 'Ask me anything...')}"
                        class="form-control"
                        required="required"
                        maxlength="1000"
                    />
                </div>
                <div class="col-2">
                    <f:form.submit
                        value="Send"
                        class="btn btn-primary w-100"
                    />
                </div>
            </div>
        </f:form>
    </div>

    <!-- New Conversation Button -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12 text-center">
                <f:link.action
                    action="chatbot"
                    controller="AIChatbot"
                    arguments="{newConversation: 1}"
                    class="btn btn-outline-secondary"
                >
                    <i class="fas fa-plus"></i> Start New Conversation
                </f:link.action>
            </div>
        </div>
    </div>

    <!-- Predefined Questions (Agent-specific) -->
    <f:if condition="{questions}">
        <div class="container mb-4">
            <div class="row">
                <div class="col-12">
                    <h4>Quick Questions:</h4>
                    <div class="d-flex flex-wrap gap-2">
                        <f:for each="{questions}" as="question">
                            <button
                                type="button"
                                class="btn btn-outline-primary btn-sm quick-question-btn"
                                onclick="document.querySelector('input[name=\'tx_aigelb_aigelbchatbot[userinput]\']').value = '{question.question -> f:format.htmlspecialchars()}'; document.querySelector('input[name=\'tx_aigelb_aigelbchatbot[userinput]\']').focus();"
                            >
                                {question.question}
                            </button>
                        </f:for>
                    </div>
                </div>
            </div>
        </div>
    </f:if>

</div>

</html>
