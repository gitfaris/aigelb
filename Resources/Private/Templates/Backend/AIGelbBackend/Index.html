<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <div class="aigelb-backend-module">

        <!-- Module Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h1 class="card-title">
                            <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:module.title" />
                        </h1>
                        <p class="card-text text-muted">
                            <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:module.description" />
                        </p>
                        <div class="alert alert-info">
                            <strong><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:overview.total_pages" />:</strong> {pageCount}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pages Table -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.title" />
                        </h3>
                    </div>
                    <div class="card-body">
                        <f:if condition="{indexedPages}">
                            <f:then>
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead class="table-dark">
                                            <tr>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.uid" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.title" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.slug" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.language" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.knowledgebase" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.last_updated" /></th>
                                                <th><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.header.status" /></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <f:for each="{indexedPages}" as="page">
                                                <tr class="align-middle">
                                                    <!-- Page UID -->
                                                    <td>
                                                        <span class="badge bg-secondary">{page.uid}</span>
                                                    </td>

                                                    <!-- Page Title -->
                                                    <td>
                                                        <strong>{page.title}</strong>
                                                        <f:if condition="{page.hidden}">
                                                            <span class="badge bg-warning ms-2">
                                                                <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:badge.hidden" />
                                                            </span>
                                                        </f:if>
                                                        <f:if condition="{page.deleted}">
                                                            <span class="badge bg-danger ms-2">
                                                                <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:badge.deleted" />
                                                            </span>
                                                        </f:if>
                                                    </td>

                                                    <!-- Page Slug -->
                                                    <td>
                                                        <code class="small">{page.slug}</code>
                                                    </td>

                                                    <!-- Language -->
                                                    <td>
                                                        <f:if condition="{page.tx_aigelb_language}">
                                                            <f:then>
                                                                <span class="badge bg-primary">{page.tx_aigelb_language}</span>
                                                            </f:then>
                                                            <f:else>
                                                                <span class="text-muted">
                                                                    <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.not_set" />
                                                                </span>
                                                            </f:else>
                                                        </f:if>
                                                    </td>

                                                    <!-- Knowledge Base -->
                                                    <td>
                                                        <f:if condition="{page.tx_aigelb_knowledgebase}">
                                                            <f:then>
                                                                <span class="badge bg-info">{page.tx_aigelb_knowledgebase}</span>
                                                            </f:then>
                                                            <f:else>
                                                                <span class="text-muted">
                                                                    <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.not_set" />
                                                                </span>
                                                            </f:else>
                                                        </f:if>
                                                    </td>

                                                    <!-- Last Updated -->
                                                    <td>
                                                        <f:if condition="{page.tx_aigelb_lastupdated}">
                                                            <f:then>
                                                                <f:format.date format="d.m.Y H:i">{page.tx_aigelb_lastupdated}</f:format.date>
                                                                <f:if condition="{page.needsUpdate}">
                                                                    <br>
                                                                    <small class="text-warning">
                                                                        <i class="fas fa-exclamation-triangle"></i>
                                                                        <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.needs_update" />
                                                                    </small>
                                                                </f:if>
                                                            </f:then>
                                                            <f:else>
                                                                <span class="text-muted">
                                                                    <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:table.never_indexed" />
                                                                </span>
                                                            </f:else>
                                                        </f:if>
                                                    </td>

                                                    <!-- Status -->
                                                    <td>
                                                        <span class="badge bg-{page.statusClass}">
                                                            <f:translate key="{page.statusLabel}" />
                                                        </span>
                                                        <f:if condition="{page.tx_aigelb_knowledgeid}">
                                                            <br>
                                                            <small class="text-muted">
                                                                ID: {page.tx_aigelb_knowledgeid -> f:format.crop(maxCharacters: 8)}...
                                                            </small>
                                                        </f:if>
                                                    </td>
                                                </tr>
                                            </f:for>
                                        </tbody>
                                    </table>
                                </div>
                            </f:then>
                            <f:else>
                                <div class="alert alert-info">
                                    <h4 class="alert-heading">
                                        <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:no_pages.title" />
                                    </h4>
                                    <p>
                                        <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:no_pages.description" />
                                    </p>
                                </div>
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:info.title" />
                        </h5>
                        <div class="row">
                            <div class="col-md-6">
                                <h6><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:info.status_legend" /></h6>
                                <ul class="list-unstyled">
                                    <li><span class="badge bg-success me-2">•</span> <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:status.up_to_date" /></li>
                                    <li><span class="badge bg-info me-2">•</span> <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:status.needs_update" /></li>
                                    <li><span class="badge bg-warning me-2">•</span> <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:status.not_indexed" /></li>
                                    <li><span class="badge bg-danger me-2">•</span> <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:status.hidden_deleted" /></li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h6><f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:info.commands_title" /></h6>
                                <p class="text-muted small">
                                    <f:translate key="LLL:EXT:aigelb/Resources/Private/Language/locallang_be.xlf:info.commands_description" />
                                </p>
                                <code class="small">php bin/typo3 aigelb:updateagent</code>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</f:section>

</html>
